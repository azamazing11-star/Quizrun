<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <title>퀴즈런</title>
  </head>
  <body>
    <div id="pre-load-msg" style="position:fixed; top:0; left:0; width:100%; height:100%; background:white; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:99999; font-family:sans-serif; font-size:1.2rem; color:#333; transition: opacity 0.15s ease-out;">
      <p style="margin:10px;">🔄 로딩 중... (Loading)</p>
      <p id="err-detail" style="color:red; font-size:0.9rem; max-width:90vw; word-break:break-all;"></p>
    </div>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        var el = document.getElementById('err-detail');
        if (el) el.textContent = '오류: ' + msg + ' (' + src + ':' + line + ')';
      };
      window.onunhandledrejection = function(e) {
        var el = document.getElementById('err-detail');
        if (el) el.textContent = '오류: ' + (e.reason || e);
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Instantly hide the loading overlay as soon as React renders into root
      (function() {
        var observer = new MutationObserver(function(mutations, obs) {
          var root = document.getElementById('root');
          var msg = document.getElementById('pre-load-msg');
          if (root && root.children.length > 0 && msg) {
            msg.style.opacity = '0';
            setTimeout(function() { if (msg.parentNode) msg.parentNode.removeChild(msg); }, 150);
            obs.disconnect();
          }
        });
        var root = document.getElementById('root');
        if (root) {
          observer.observe(root, { childList: true });
        }
      })();
    </script>
  </body>
</html>
